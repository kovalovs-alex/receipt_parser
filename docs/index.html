<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt Parser Demo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: system-ui, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
        color: #222;
      }

      h1 { margin-bottom: 4px; }
      .subtitle { color: #666; margin-bottom: 32px; font-size: 0.95rem; }

      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 20px;
      }

      label { font-weight: 600; display: block; margin-bottom: 8px; }

      input[type="file"] {
        display: block;
        width: 100%;
        padding: 10px;
        border: 2px dashed #bbb;
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
        font-size: 0.9rem;
      }
      input[type="file"]:hover { border-color: #888; }

      button {
        margin-top: 16px;
        padding: 10px 28px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #1d4ed8; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      #status {
        margin-top: 12px;
        font-size: 0.9rem;
        color: #555;
        min-height: 1.4em;
      }

      /* Output section */
      #output:empty { display: none; }

      .error {
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 12px 16px;
      }

      .receipt-header { margin-bottom: 16px; }
      .receipt-header h2 { margin: 0 0 6px; font-size: 1.2rem; }
      .receipt-header p { margin: 2px 0; color: #555; font-size: 0.9rem; }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 2px solid #e5e7eb;
        color: #374151;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      td {
        padding: 8px 10px;
        border-bottom: 1px solid #f3f4f6;
        vertical-align: top;
      }
      tr:last-child td { border-bottom: none; }
      td.num { text-align: right; }

      .total-row {
        font-weight: 700;
        border-top: 2px solid #e5e7eb !important;
      }

      .badge-discount {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        background: #dcfce7;
        color: #166534;
        border-radius: 4px;
        font-size: 0.75rem;
      }

      .raw-toggle {
        margin-top: 16px;
        font-size: 0.85rem;
        color: #2563eb;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        text-decoration: underline;
      }
      pre {
        margin-top: 8px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 12px;
        font-size: 0.78rem;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 300px;
        overflow-y: auto;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B1HUaQYx.js"></script>
  </head>
  <body>
    <h1>Receipt Parser</h1>
    <p class="subtitle">
      Parse Latvian store receipts (Maxima &amp; Rimi) from PDF files — fully client-side.
    </p>

    <div class="card">
      <label for="file-input">Select a receipt PDF</label>
      <input type="file" id="file-input" accept=".pdf,application/pdf" />
      <button id="parse-button">Parse Receipt</button>
      <div id="status"></div>
    </div>

    <div class="card" id="output"></div>

  </body>
</html>
